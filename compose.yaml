# GrandEunuch 常驻服务。账本（~/.grandeunuch/data）与凭据（~/.grandeunuch/.env）
# 都在 worktree 之外：容器随时可弃可换，worktree 被清理也带不走数据。
services:
  grandeunuch:
    build: .
    container_name: grandeunuch
    ports:
      - "3100:3000" # 3000 被镜场占着，对外沿用 3100
    env_file:
      - ${HOME}/.grandeunuch/.env
    environment:
      DB_PATH: /app/data/kokanee.sqlite
      TZ: Asia/Shanghai
    volumes:
      - ${HOME}/.grandeunuch/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>{if(!r.ok)throw new Error(String(r.status))}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
